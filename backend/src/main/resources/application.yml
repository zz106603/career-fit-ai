spring:
  application:
    name: career-fit-ai
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

career-fit:
  async:
    dispatcher:
      enabled: false
      fixed-delay: 5s
      batch-size: 10
    recovery:
      enabled: false
      fixed-delay: 1m
      stale-threshold: 10m
      max-retries: 3
      batch-size: 10

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
