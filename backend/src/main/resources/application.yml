spring:
  application:
    name: career-fit-ai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

career-fit:
  ai:
    provider: ${AI_PROVIDER:fake}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-5.6-luna}
      timeout: ${OPENAI_TIMEOUT:30s}
      max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:500}
    structured-output:
      retry:
        max-attempts: ${AI_STRUCTURED_MAX_ATTEMPTS:3}
        initial-delay-ms: ${AI_STRUCTURED_INITIAL_DELAY_MS:200}
        multiplier: ${AI_STRUCTURED_BACKOFF_MULTIPLIER:2.0}
        max-delay-ms: ${AI_STRUCTURED_MAX_DELAY_MS:2000}
  storage:
    local:
      root: ${FILE_STORAGE_ROOT:./data/files}
  async:
    dispatcher:
      enabled: ${ASYNC_DISPATCHER_ENABLED:false}
      fixed-delay: ${ASYNC_DISPATCHER_FIXED_DELAY:5s}
      batch-size: ${ASYNC_DISPATCHER_BATCH_SIZE:10}
    recovery:
      enabled: false
      fixed-delay: 1m
      stale-threshold: 10m
      max-retries: 3
      batch-size: 10

server:
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
